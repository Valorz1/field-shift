services:
  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      MODEL_BASE_URL: ${MODEL_BASE_URL:-http://model:11434}
      MODEL_NAME: ${MODEL_NAME:-gemma4:e4b}
    depends_on:
      - model

  # Example local model runner. Pull/configure a model separately for your hardware.
  model:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - model_data:/root/.ollama

volumes:
  model_data:
